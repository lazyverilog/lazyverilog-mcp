name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Tests drive a real server; use the latest LazyVerilog release binary.
      - name: Download lazyverilog-lsp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lazyverilog/LazyVerilog \
            --pattern "lazyverilog-lsp-*-${{ matrix.platform }}${{ matrix.ext }}" --dir lsp
          mv lsp/lazyverilog-lsp-* "lsp/lazyverilog-lsp${{ matrix.ext }}"
          chmod +x "lsp/lazyverilog-lsp${{ matrix.ext }}"
          "lsp/lazyverilog-lsp${{ matrix.ext }}" --version
          # node prints a native path (D:\a\... on Windows), which spawn() accepts.
          echo "LAZYVERILOG_LSP=$(node -p "require('path').resolve('lsp/lazyverilog-lsp${{ matrix.ext }}')")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The published bundle must start on the oldest supported Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Smoke test bundle on Node 20
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | node dist/index.js | grep -q '"serverInfo"'
