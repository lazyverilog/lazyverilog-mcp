name: CI

on:
  push:
    branches: [main]
  pull_request:
  # LazyVerilog's release workflow runs this after each release, since users get it automatically.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Tests download the latest LazyVerilog release, as users' installs do.
      - run: npm test

      # The published bundle must start on the oldest supported Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Smoke test bundle on Node 20
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | node dist/index.js | grep -q '"serverInfo"'
